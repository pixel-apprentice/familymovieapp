<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

  <!-- PWA / Theme -->
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="application-name" content="Pizza Movie Night" />
  <meta name="description" content="Family movie night tracker — pizza included 🍕🎬" />

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Movie Night" />
  <link rel="apple-touch-icon" href="/pwa-192.png" />

  <!-- Favicon — emoji fallback (vite-plugin-pwa injects manifest link automatically) -->
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍕</text></svg>" />

  <title>Pizza Movie Night</title>
  <style id="fmn-safety-css">
    /* Bulletproof TV Fallbacks: Injected directly to prevent white screens */
    :root {
      --theme-base: #000000;
      --theme-surface: #0a0a0a;
      --theme-primary: #ffffff;
      --theme-secondary: #a3a3a3;
      --theme-text: #ffffff;
      --theme-muted: #737373;
      --theme-border: #262626;
      --theme-accent: #ffffff;
    }
    html, body {
      background-color: #000;
      color: #fff;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      font-family: sans-serif; /* High-reliability fallback */
    }
    #root {
      background-color: #000;
    }
  </style>
  <!-- Google Cast SDK -->
  <script type="text/javascript"
    src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script type="text/javascript">
    // ZERO-LATENCY RECEIVER BOOT: Initialize CAF Receiver immediately on TV devices.
    // This must fire BEFORE React boots to avoid the Chromecast Ultra's strict handshake timeout.
    if (navigator.userAgent.indexOf('CrKey') > -1) {
      window.isCastReceiver = true;
      const s = document.createElement('script');
      s.src = "https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
      s.onload = () => {
        try {
          const context = cast.framework.CastReceiverContext.getInstance();
          // We can set options here if needed, but start() is what tells the phone "I AM ALIVE"
          context.start();
          console.log('[TV] Cast Receiver Context started via index.html');
        } catch (e) {
          console.error('[TV] Failed to start receiver in head:', e);
        }
      };
      document.head.appendChild(s);
    }
  </script>
</head>

<body style="margin: 0;">
  <!-- DIAGNOSTIC OVERLAY: Hidden by index.css. If visible, the external CSS failed to load. -->

</html>
