  <title>Pizza Movie Night</title>
  <style id="fmn-safety-css">
    /* Bulletproof TV Fallbacks: Injected directly to prevent white screens */
    :root {
      --theme-base: #000000;
      --theme-surface: #0a0a0a;
      --theme-primary: #ffffff;
      --theme-secondary: #a3a3a3;
      --theme-text: #ffffff;
      --theme-muted: #737373;
      --theme-border: #262626;
      --theme-accent: #ffffff;
    }
    html, body {
      background-color: var(--theme-base);
      color: var(--theme-text);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
      font-family: sans-serif; /* High-reliability fallback */
      transition: background-color 0.3s ease;
    }
    #root {
      background-color: transparent;
    }
  </style>
  <!-- Google Cast SDK -->
  <script type="text/javascript"
    src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
  <script type="text/javascript">
    // ROBUST ZERO-LATENCY RECEIVER BOOT: 
    // Fires BEFORE React and polls for the 'cast' global to handle SDK initialization lag.
    const ua = navigator.userAgent;
    const isTVAgent = ua.indexOf('CrKey') > -1 || (ua.indexOf('Android') > -1 && ua.indexOf('TV') > -1);
    const isCouchPath = window.location.pathname.startsWith('/tv');

    if (isTVAgent || isCouchPath) {
      window.isCastReceiver = true;
      const s = document.createElement('script');
      s.src = "https://www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js";
      s.onload = () => {
        let attempts = 0;
        const maxAttempts = 40; // 2 seconds total

        const startWithRetry = () => {
          try {
            const castFramework = window.cast?.framework;
            const context = castFramework?.CastReceiverContext?.getInstance();
            if (context) {
              context.start();
              console.log('[TV] Cast Receiver Context started successfully after', attempts, 'retries.');
              return;
            }
          } catch (e) {
            console.warn('[TV] Init attempt failed:', e);
          }

          attempts++;
          if (attempts < maxAttempts) {
            setTimeout(startWithRetry, 50);
          } else {
            console.error('[TV] Cast Receiver failed to initialize after 2 seconds.');
          }
        };

        startWithRetry();
      };
      document.head.appendChild(s);
    }
  </script>
</head>
